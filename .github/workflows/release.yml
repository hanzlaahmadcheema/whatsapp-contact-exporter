name: Build and Publish Multi-Platform Release

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish as official GitHub Release? (true to create release, false for test build only)'
        required: true
        type: boolean
        default: false
      release_tag:
        description: 'Release Tag (e.g. v1.0.2 - required only if publishing)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            node: 20.x
            script: npm run package:win
          - os: macos-latest
            node: 20.x
            script: npm run package:mac
          - os: ubuntu-latest
            node: 20.x
            script: npm run package:linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build Platform Standalone Executable
        run: ${{ matrix.script }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}
          path: |
            release/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: inputs.publish_release == true && inputs.release_tag != ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Consolidate Release Binaries & Generate Unified SHA256SUMS
        run: |
          mkdir -p release-assets
          find all-artifacts -type f \( -name "whatsapp-contact-exporter*" \) ! -name "SHA256SUMS.txt" -exec cp {} release-assets/ \;
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          ls -la

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: Release ${{ inputs.release_tag }}
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
