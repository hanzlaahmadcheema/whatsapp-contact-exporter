name: Build and Publish Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build Windows Portable Executable
        run: node scripts/build-windows.mjs

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-contact-exporter-windows-x64
          path: |
            release/whatsapp-contact-exporter-windows-x64.exe
            release/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/whatsapp-contact-exporter-windows-x64.exe
            release/SHA256SUMS.txt
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
